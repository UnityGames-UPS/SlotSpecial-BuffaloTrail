<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <!-- Lock the viewport: no user zoom, cover the notch — so the canvas can pin to innerWidth/innerHeight. -->
  <meta name="viewport"
    content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Buffalo</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      /* position:fixed + overscroll-behavior:none stop iOS rubber-band / pinch from scrolling the page. */
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background-color: black;
      touch-action: none;
    }

    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #loading-screen {
      position: absolute;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    let resizeTimeout;
    // Unity instance handle — captured once createUnityInstance resolves so the
    // parent -> iframe message listener (see bottom of this script) can SendMessage into Unity.
    var unityInstance = null;
    // De-dupe guard so we only forward a given loader percentage to the host once.
    var lastProgressSent = -1;

    // Forward WebGL loader progress to the iframe host (GameLoader listens for "UnityLoaderProgress").
    // Loading-complete is NOT reported here — the host hides its loader on Unity's "OnEnter".
    function sendProgressToPlatform(progressValue) {
      var percentage = Math.round(progressValue * 100);
      if (percentage === lastProgressSent) return;
      lastProgressSent = percentage;
      if (window.parent) {
        window.parent.postMessage({ type: "UnityLoaderProgress", progress: percentage }, "*");
      }
    }
    // Pin the canvas to the full viewport. Aspect ratio and portrait/landscape rotation are owned
    // by Unity (OrientationChange.SwitchDisplay), so the page just fills the visible viewport.
    function resizeCanvas() {
      // Prefer visualViewport — on iOS it reflects the truly visible area (toolbars/pinch) and,
      // unlike window.innerWidth/Height, is not stale right after an orientation change.
      var vv = window.visualViewport;
      var w = Math.round(vv ? vv.width : window.innerWidth);
      var h = Math.round(vv ? vv.height : window.innerHeight);

      // Snap any pinch/rubber-band offset back to the origin so the canvas stays aligned.
      window.scrollTo(0, 0);

      // Size html/body/canvas explicitly — iOS "100%"/"100vh" on a fixed body is unreliable.
      document.documentElement.style.width = w + "px";
      document.documentElement.style.height = h + "px";
      document.body.style.width = w + "px";
      document.body.style.height = h + "px";
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
    }

    function scheduleResize() {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(resizeCanvas, 50);
    }

    // iOS fires orientationchange BEFORE the layout/dimensions settle, so re-apply a few times.
    function handleOrientationChange() {
      resizeCanvas();
      setTimeout(resizeCanvas, 100);
      setTimeout(resizeCanvas, 300);
      setTimeout(resizeCanvas, 600);
    }

    window.addEventListener('resize', scheduleResize);
    window.addEventListener('orientationchange', handleOrientationChange);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', scheduleResize);
      window.visualViewport.addEventListener('scroll', function () { window.scrollTo(0, 0); });
    }
    // Keep the game pinned to the viewport. CSS touch-action alone does NOT stop iOS two-finger /
    // pinch panning — a non-passive touchmove preventDefault is required. Unity still receives the
    // touch events for game input (preventDefault only cancels the browser's scroll/zoom default).
    window.addEventListener('scroll', function () { window.scrollTo(0, 0); }, { passive: true });
    document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    document.addEventListener('gesturechange', function (e) { e.preventDefault(); });

    var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Build.loader.js";
      var config = {
        dataUrl: buildUrl + "/Build.data.unityweb",
        frameworkUrl: buildUrl + "/Build.framework.js.unityweb",
        codeUrl: buildUrl + "/Build.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Buffalo",
        productVersion: "1.0",
      };

        
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            sendProgressToPlatform(progress);
          }).then((instance) => {
            unityInstance = instance;
            resizeCanvas();
          }).catch((message) => {
            alert(message);
          });

        };
        script
        
        document.body.appendChild(script);
       // window.addEventListener('load', resizeCanvas());
  </script>
     <script type="text/javascript">
        console.log = function() {};
        console.warn = function() {};
        console.error = function() {};
    </script>
    <script>
      // Inbound bridge: parent (iframe host) -> Unity.
      // The host posts { type, data } into this iframe; we translate recognized
      // messages into Unity SendMessage calls on the "SocketManager" GameObject.
      window.addEventListener("message", function (event) {
        if (!event.data || !event.data.type) return;
        switch (event.data.type) {
          // NOTE: "TokenReceived" is kept to match the current host contract.
          // TODO(rename): give this a clearer name (e.g. "AuthTokenResponse") once the host is updated.
          case "TokenReceived":
            if (unityInstance) {
              unityInstance.SendMessage(
                "SocketManager",
                "ReceiveAuthToken",
                JSON.stringify(event.data.data)
              );
            }
            break;
          // Host-initiated graceful close -> C# CloseSocket() closes the socket and emits "OnExit".
          case "CloseGame":
            if (unityInstance) {
              unityInstance.SendMessage("SocketManager", "CloseGame");
            }
            break;
        }
      });
    </script>
    <script>
      window.focus();
    </script>

</body>

</html>
