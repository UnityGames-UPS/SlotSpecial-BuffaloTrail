<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Buffalo</title>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: black;
    }

    #unity-canvas {
      height: 100%;
      width: 100%;
    }

      #loading-screen {
      position: absolute;
      width: 100%;
      height: 100%;
  }


  </style>
</head>

<body>

  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    var IsMobile = false;
    var AspectRatio =16/9;
    let resizeTimeout;
    // Unity instance handle — captured once createUnityInstance resolves so the
    // parent -> iframe message listener (see bottom of this script) can SendMessage into Unity.
    var unityInstance = null;
    // De-dupe guard so we only forward a given loader percentage to the host once.
    var lastProgressSent = -1;

    // Forward WebGL loader progress to the iframe host (GameLoader listens for "UnityLoaderProgress").
    // Loading-complete is NOT reported here — the host hides its loader on Unity's "OnEnter".
    function sendProgressToPlatform(progressValue) {
      var percentage = Math.round(progressValue * 100);
      if (percentage === lastProgressSent) return;
      lastProgressSent = percentage;
      if (window.parent) {
        window.parent.postMessage({ type: "UnityLoaderProgress", progress: percentage }, "*");
      }
    }
    // // Function to detect if the device is mobile
    function isMobile(unityInstance) {
        console.log("Called isMobile");
        
        var userAgent = navigator.userAgent || navigator.vendor || window.opera;
        // Check for various mobile devices
        var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        var isIphone = /iPhone|iPad|iPod/i.test(navigator.userAgent);
        // console.log(isMobile);
        IsMobile = isMobile;
        if(isMobile == true){
          AspectRatio=1080 / 2340;
        }
        else{
          AspectRatio=16/9;
        }
        resizeCanvas();
    }

    // Resize canvas based on device type and window size
    function resizeCanvas() {
    const isPortrait = window.innerHeight > window.innerWidth;
    const aspectRatio = isPortrait ? (1080 / 2340) : AspectRatio;

    let windowWidth = window.innerWidth;
    let windowHeight = window.innerHeight;

    if (IsMobile) {
        console.log("Mobile Detected");
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        canvas.style.width = `${100}%`;
        canvas.style.height = `${100}%`;


    } else {
        // PC Landscape Mode
        let canvasWidth = windowWidth;
        let canvasHeight = canvasWidth / aspectRatio;

        if (canvasHeight > windowHeight) {
            canvasHeight = windowHeight;
            canvasWidth = canvasHeight * aspectRatio;
        }

        canvas.style.width = `${canvasWidth}px`;
        canvas.style.height = `${canvasHeight}px`;

        // Force redraw to fix potential rendering issues
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;
    }
}

    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(resizeCanvas, 50);
    });

    var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Build.loader.js";
      var config = {
        dataUrl: buildUrl + "/Build.data.unityweb",
        frameworkUrl: buildUrl + "/Build.framework.js.unityweb",
        codeUrl: buildUrl + "/Build.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Buffalo",
        productVersion: "1.0",
      };

        
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            sendProgressToPlatform(progress);
          }).then((instance) => {
            unityInstance = instance;
            isMobile(instance);
          }).catch((message) => {
            alert(message);
          });

        };
        script
        
        document.body.appendChild(script);
       // window.addEventListener('load', resizeCanvas());
  </script>
     <script type="text/javascript">
        console.log = function() {};
        console.warn = function() {};
        console.error = function() {};
    </script>
    <script>
      // Inbound bridge: parent (iframe host) -> Unity.
      // The host posts { type, data } into this iframe; we translate recognized
      // messages into Unity SendMessage calls on the "SocketManager" GameObject.
      window.addEventListener("message", function (event) {
        if (!event.data || !event.data.type) return;
        switch (event.data.type) {
          // NOTE: "TokenReceived" is kept to match the current host contract.
          // TODO(rename): give this a clearer name (e.g. "AuthTokenResponse") once the host is updated.
          case "TokenReceived":
            if (unityInstance) {
              unityInstance.SendMessage(
                "SocketManager",
                "ReceiveAuthToken",
                JSON.stringify(event.data.data)
              );
            }
            break;
          // Host-initiated graceful close -> C# CloseSocket() closes the socket and emits "OnExit".
          case "CloseGame":
            if (unityInstance) {
              unityInstance.SendMessage("SocketManager", "CloseGame");
            }
            break;
        }
      });
    </script>
    <script>
      window.focus();
    </script>

</body>

</html>
